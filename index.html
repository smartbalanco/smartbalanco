<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smartbalanço</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a3a5c" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --azul: #1a3a5c;
      --azul-claro: #2c5f8a;
      --verde: #2e9e6b;
      --cinza-fundo: #f4f6f9;
      --cinza-texto: #64748b;
      --borda: #e2e8f0;
      --vermelho: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cinza-fundo); color: #1e293b;
      min-height: 100vh; min-height: 100dvh;
    }

    /* ---------- CARREGANDO ---------- */
    #tela-carregando {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh; gap: 20px;
    }
    .spinner {
      width: 44px; height: 44px; border: 4px solid var(--borda);
      border-top-color: var(--azul); border-radius: 50%; animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* ---------- LOGIN ---------- */
    #tela-login {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh; padding: 24px; text-align: center; position: relative;
    }
    #tela-login img.logo { width: 130px; height: 130px; margin-bottom: 8px; }
    #tela-login h1 { font-size: 26px; color: var(--azul); font-weight: 700; margin-bottom: 4px; }
    #tela-login p.sub { color: var(--cinza-texto); font-size: 14px; margin-bottom: 36px; }
    #botao-google { display: flex; justify-content: center; margin-bottom: 16px; }
    #login-erro {
      display: none; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      border-radius: 8px; padding: 12px 16px; font-size: 13px; max-width: 320px; margin-top: 8px;
    }
    .rodape-login { position: absolute; bottom: 20px; left: 0; right: 0; font-size: 11px; color: #94a3b8; }

    /* ---------- TELA INTERNA ---------- */
    #tela-interna { display: none; padding-bottom: 30px; }
    .topo {
      background: var(--azul); color: #fff; padding: 16px 20px;
      padding-top: max(16px, env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10;
    }
    .topo .titulo-area { display: flex; flex-direction: column; }
    .topo .nome-app { font-size: 18px; font-weight: 700; line-height: 1.1; }
    .topo .mes { font-size: 12px; color: #a9c4dd; margin-top: 2px; }
    .topo .acoes { display: flex; gap: 8px; align-items: center; }
    .topo button {
      background: rgba(255,255,255,0.15); color: #fff; border: none;
      padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    #btn-atualizar { font-size: 16px; padding: 7px 11px; }
    #btn-atualizar.girando { animation: girar 0.8s linear infinite; }

    .conteudo { padding: 16px; max-width: 620px; margin: 0 auto; }
    .card {
      background: #fff; border: 1px solid var(--borda); border-radius: 14px;
      padding: 18px; margin-bottom: 14px;
    }
    .card h2 {
      font-size: 13px; color: var(--cinza-texto); margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;
    }
    .vazio { font-size: 13px; color: #94a3b8; font-style: italic; text-align: center; padding: 8px 0; }

    /* Card Saldo */
    .saldo-destaque { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
    .saldo-sub { display: flex; gap: 20px; margin-top: 10px; }
    .saldo-sub div { flex: 1; }
    .saldo-sub .lbl { font-size: 11px; color: var(--cinza-texto); text-transform: uppercase; }
    .saldo-sub .val { font-size: 15px; font-weight: 700; }
    .saldo-sub .val.rec { color: var(--verde); }
    .saldo-sub .val.des { color: var(--vermelho); }
    .status-desp {
      display: flex; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--borda);
    }
    .status-desp div { flex: 1; text-align: center; background: var(--cinza-fundo); border-radius: 10px; padding: 10px; }
    .status-desp .lbl { font-size: 11px; color: var(--cinza-texto); }
    .status-desp .val { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .status-desp .val.paga { color: var(--verde); }
    .status-desp .val.pend { color: #f97316; }

    /* Card Score */
    .score-topo { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .score-num { font-size: 30px; font-weight: 800; }
    .score-class { font-size: 15px; font-weight: 700; }
    .score-barra { background: var(--borda); border-radius: 6px; height: 10px; overflow: hidden; }
    .score-barra-preenchida { height: 10px; border-radius: 6px; width: 0; transition: width 0.6s; }
    .score-det { font-size: 11px; color: var(--cinza-texto); margin-top: 10px; line-height: 1.5; }

    /* Listas */
    .linha-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #f1f3f4; font-size: 14px; gap: 10px;
    }
    .linha-item:last-child { border-bottom: none; }
    .li-esq { color: #334155; flex: 1; }
    .li-data { color: var(--azul-claro); font-size: 13px; margin-right: 4px; }
    .li-valor { font-weight: 700; white-space: nowrap; }
    .li-valor.vermelho { color: var(--vermelho); }

    /* Categorias */
    .cat-item { margin-bottom: 12px; }
    .cat-item:last-child { margin-bottom: 0; }
    .cat-topo { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .cat-nome { color: #334155; }
    .cat-valor { font-weight: 700; color: var(--vermelho); }
    .cat-barra { background: var(--borda); border-radius: 5px; height: 8px; overflow: hidden; }
    .cat-barra-preenchida { background: var(--azul-claro); height: 8px; border-radius: 5px; }

    /* Cartões */
    .cartao-item { padding: 12px 0; border-bottom: 1px solid #f1f3f4; }
    .cartao-item:last-child { border-bottom: none; }
    .cartao-nome { font-weight: 700; color: var(--azul); font-size: 14px; margin-bottom: 8px; }
    .cartao-valores { display: flex; gap: 12px; }
    .cartao-valores div { flex: 1; background: var(--cinza-fundo); border-radius: 8px; padding: 8px 10px; }
    .cv-label { display: block; font-size: 10px; color: var(--cinza-texto); text-transform: uppercase; }
    .cv-num { display: block; font-size: 15px; font-weight: 700; color: var(--azul); margin-top: 2px; }
    .cv-num.cinza { color: var(--cinza-texto); }
  </style>
</head>
<body>

  <!-- CARREGANDO -->
  <div id="tela-carregando">
    <div class="spinner"></div>
    <p id="carregando-msg" style="color:var(--cinza-texto); font-size:14px;">Carregando...</p>
  </div>

  <!-- LOGIN -->
  <div id="tela-login">
    <img src="icon-512.png" class="logo" alt="Smartbalanço" />
    <h1>Smartbalanço</h1>
    <p class="sub">Gestão financeira pessoal</p>
    <div id="botao-google"></div>
    <div id="login-erro"></div>
    <div class="rodape-login">Acesso restrito &middot; Smartbalanço 2.0</div>
  </div>

  <!-- INTERNA (DASHBOARD) -->
  <div id="tela-interna">
    <div class="topo">
      <div class="titulo-area">
        <span class="nome-app">Smartbalanço</span>
        <span class="mes" id="mes-referencia"></span>
      </div>
      <div class="acoes">
        <button id="btn-atualizar" onclick="atualizarDashboard()" title="Atualizar">&#8635;</button>
        <button onclick="sair()">Sair</button>
      </div>
    </div>

    <div class="conteudo">

      <!-- SALDO -->
      <div class="card">
        <h2>Saldo do mês</h2>
        <div class="saldo-destaque" id="saldo-valor">R$ 0,00</div>
        <div class="saldo-sub">
          <div><span class="lbl">Receitas</span><br><span class="val rec" id="saldo-receitas">R$ 0,00</span></div>
          <div><span class="lbl">Despesas</span><br><span class="val des" id="saldo-despesas">R$ 0,00</span></div>
        </div>
        <div class="status-desp">
          <div><div class="lbl">✅ Pagas</div><div class="val paga" id="desp-pagas">R$ 0,00</div></div>
          <div><div class="lbl">⏳ Pendentes</div><div class="val pend" id="desp-pendentes">R$ 0,00</div></div>
        </div>
      </div>

      <!-- SCORE -->
      <div class="card">
        <h2>Saúde financeira</h2>
        <div class="score-topo">
          <span class="score-num" id="score-valor">-/100</span>
          <span class="score-class" id="score-classificacao"></span>
        </div>
        <div class="score-barra"><div class="score-barra-preenchida" id="score-barra-preenchida"></div></div>
        <div class="score-det" id="score-detalhes"></div>
      </div>

      <!-- CONTAS A VENCER -->
      <div class="card">
        <h2>Contas a vencer (15 dias)</h2>
        <div id="lista-vencer"></div>
      </div>

      <!-- TOP CATEGORIAS -->
      <div class="card">
        <h2>Maiores gastos do mês</h2>
        <div id="lista-categorias"></div>
      </div>

      <!-- CARTÕES -->
      <div class="card">
        <h2>Faturas dos cartões</h2>
        <div id="lista-cartoes"></div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
